# imported from RAWDATA.md 2026-10-11 — edit here from now on (JA added 2026-10-12)
- id: lore-1
  sticker: heart
  text:
    ja: カメラの外では人見知りで内向的。でも配信ではにぎやかで、ときどき駄々っ子。根っこはやさしくて責任感が強い。
    en: Shy and introverted off-camera, energetic and chaotic on stream; prone to tantrums, kind and responsible underneath.
- id: lore-2
  sticker: pad
  text:
    ja: 腕前はガチのゲーマー。APEX（ソロでダイヤ・マスター）、LoL、ダークソウルやSEKIROのRTA、Jump Kingクリア、スマブラSPのやり込み。
    en: "Elite gamer: Apex Legends (Diamond, later Solo Master), League of Legends, Dark Souls and Sekiro speedruns, a Jump King clear, Smash Bros. Ultimate grinding."
- id: lore-3
  sticker: onion
  text:
    ja: おなじみのネタは「引退」ドッキリ（2019年2月2日、ホロ鯖で自分のTNT像を爆破）、真っ暗な画面での配信終わり、「オニオン」と「モップ」、妹キャラ「あくたん」。
    en: 'Running gags: fake "retirements" (TNT-model stunt on the hololive Minecraft server, 2 Feb 2019), stream endings on a black screen, the "onion" and "mop" fan memes, her "little sister" persona Aqutan.'
- id: lore-4
  sticker: anchor
  text:
    ja: マイクラでは「鉄あくあ団」「ホロライブレジスタンス」、そして建設会社「AKUKIN建設」を率いた。
    en: Led the Minecraft groups Iron Aqua Group / hololive Resistance and the construction company Akukin Kensetsu.
- id: lore-5
  sticker: cat
  text:
    ja: 仲良しの組み合わせは、卍組（シオン・あやめ）、めあくあ（神楽めあ）、あくあマリン（宝鐘マリン）、ARKのCAMP（ココ・マリン・ぺこら）。
    en: "Close pairings: Manjigumi (with Shion and Ayame), Meaqua (with Kagura Mea), Aquamarine (with Houshou Marine), CAMP (ARK, with Coco, Marine, Pekora)."
- id: lore-6
  sticker: note
  text:
    ja: ユニットはSpice Love、NEGI☆U、UMISEA、Bouquet、Blue Journey、そしてhololive IDOL PROJECT。
    en: "Units: Spice Love, NEGI☆U, UMISEA, Bouquet, Blue Journey, hololive IDOL PROJECT."
- id: lore-7
  sticker: heart
  text:
    ja: 自身が主演のノベルゲーム『あくありうむ。』を発売し、ファミ通アワード2022で主演賞を受賞。
    en: Starred in her own visual novel, AQUARIUM. (あくありうむ。), which won Best Actor at the 2022 Famitsu Awards.
- id: lore-8
  sticker: onion
  text:
    ja: 「44.5」はクルーなら誰でも知っている数字。このアーカイブのプロジェクト名もそこから。
    en: '"44.5" is a number every crew member knows by heart. This archive''s project name borrows it.'
