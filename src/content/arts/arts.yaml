# Curated art list (EXECUTIONPLAN §8.5 / §8.7). Hand-maintained.
# `file` = path inside Project 44.5/assets/. `scripts/prepare-images.ts` copies it to src/assets/art/<section>/<id>.<ext>,
# writes `image`, and refreshes `credit` + `source` from data/raw/manifest.json.
# Left out on purpose: logos (site chrome), Live2D portraits (used as Talk expressions), duplicates, animated GIFs,
# press-article images (publisher copyright) and Gaou's pin-up / lingerie pieces (keeps the archive all-ages).

