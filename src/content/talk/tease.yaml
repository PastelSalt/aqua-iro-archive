# Tease — affectionate fan-lore teasing; she gets flustered or wins it back. Fan-written lines.
- id: real-maid
  title: { ja: "ほんとにメイド？", en: "A real maid?" }
  category: tease
  lines:
    - { exp: smug, ja: "なにかご用？ご主人。メイドのあてぃしにおまかせ！", en: "Need something, Master? Leave it to your maid!" }
  choices:
    - id: really
      ja: "ほんとにメイドなの？"
      en: "Are you really a maid?"
      reply:
        - { exp: pout, ja: "メイドったらメイドなの！！服、見てよ！", en: "A maid is a maid!! Look at the uniform!" }
      next: proof
    - id: clumsy
      ja: "ドジっ子メイドだよね"
      en: "You're a clumsy maid, right?"
      reply:
        - { exp: flustered, ja: "ド、ドジじゃないし！床がすべっただけだし！", en: "I-I'm not clumsy! The floor slipped, okay!" }
    - id: mop
      ja: "モップはどこ？"
      en: "Where's your mop?"
      reply:
        - { exp: smug, ja: "モップは心の中にあるの。見えないだけ。いひひ", en: "The mop lives in my heart. You just can't see it. Ihihi." }
    - id: serve
      ja: "じゃあ、お茶をお願い"
      en: "Then a cup of tea, please"
      reply:
        - { exp: flustered, ja: "はーい！……そーっと……そーっと……あっ", en: "Coming! ...Slowly... slowly... oops." }
  nodes:
    proof:
      lines:
        - { exp: smug, ja: "ほら、ヘッドドレスにも錨マーク！完璧じゃん！", en: "See? Even the headdress has an anchor. Perfect!" }
      choices: []

- id: weak-strong
  title: { ja: "よわよわ？つよつよ？", en: "Weak or strong?" }
  category: tease
  lines:
    - { exp: cool, ja: "今日のあてぃし、つよいよ？完全に理解したから", en: "I'm strong today, you know? I've completely figured it out." }
  choices:
    - id: weak
      ja: "でもすぐ泣いちゃうじゃん"
      en: "But you cry so easily"
      reply:
        - { exp: pout, ja: "泣いてないし！目にゴミが入っただけだし！", en: "I'm not crying! Something got in my eye!" }
    - id: strong
      ja: "ゲームのときは最強だよね"
      en: "You're the strongest in games, though"
      reply:
        - { exp: smug, ja: "でしょ！？もっとほめていいよ！ほら！ほら！", en: "Right!? Praise me more! Go on! Go on!" }
    - id: horror
      ja: "ホラゲの悲鳴、聞こえてたよ"
      en: "We heard your horror-game screams"
      reply:
        - { exp: flustered, ja: "あ、あれはリアクション芸！プロだから！！", en: "Th-that was a bit! I'm a professional!!" }
    - id: duel
      ja: "じゃあ勝負しよう"
      en: "Then let's have a match"
      reply:
        - { exp: cool, ja: "おまえ、よわい。あてぃし、つよい。", en: "You, weak. Me, strong." }
        - { exp: smug, ja: "……はい、あてぃしの勝ち！ぴゃーっ！！", en: "...And that's my win! Pyaaah!!" }

- id: black-screen
  title: { ja: "まっくらエンディング", en: "The black-screen ending" }
  category: tease
  lines:
    - { exp: calm, ja: "そろそろ配信おわろっかな〜", en: "Maybe I'll wrap up the stream soon~" }
  choices:
    - id: screen
      ja: "また画面まっくらで終わるの？"
      en: "Ending on a black screen again?"
      reply:
        - { exp: smug, ja: "それがあてぃしのスタイルなの！", en: "That's my signature style!" }
    - id: retire
      ja: "また「引退」ドッキリ？"
      en: "Another fake 'retirement' prank?"
      reply:
        - { exp: flustered, ja: "あ、あれはもうやらないってば！反省してます！！", en: "I said I won't do that again! I've learned my lesson!!" }
    - id: one-more
      ja: "あと5分だけ！"
      en: "Just five more minutes!"
      reply:
        - { exp: cheerful, ja: "しょうがないなぁ。じゃあ、あと1時間ね！", en: "Oh, fine. Make it one more hour, then!" }
    - id: otsu
      ja: "おつあくあ～"
      en: "Otsu-aqua~"
      reply:
        - { exp: cheerful, ja: "おつあくあ〜！⚓ また明日！", en: "Otsu-aqua~! ⚓ See you tomorrow!" }

- id: onion-time
  title: { ja: "玉ねぎの時間", en: "Onion time" }
  category: tease
  rare: true
  weight: 6
  lines:
    - { exp: flustered, ja: "……なんか今日、玉ねぎくさくない？", en: "...Doesn't it smell kind of oniony today?" }
  choices:
    - id: yes
      ja: "クルーが持ってきました"
      en: "The crew brought some"
      reply:
        - { exp: pout, ja: "やっぱり！どこから持ってくるの、それ！！", en: "I knew it! Where do you even get those!?" }
    - id: chop
      ja: "いっしょに刻もう"
      en: "Let's chop them together"
      reply:
        - { exp: flustered, ja: "目が！目がぁ！これ涙じゃないから！！", en: "My eyes! My eyes! These are NOT tears!!" }
    - id: soup
      ja: "オニオンスープにしよう"
      en: "Let's make onion soup"
      reply:
        - { exp: cheerful, ja: "……それはちょっとおいしそうかも。ずるい", en: "...Okay, that does sound tasty. Not fair." }
    - id: hide
      ja: "かくしておくね"
      en: "I'll hide them for you"
      reply:
        - { exp: shy, ja: "ありがと……あなた、いいクルーじゃん", en: "Thanks... you're a good crew member, you know." }
