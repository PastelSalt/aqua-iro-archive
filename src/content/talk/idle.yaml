# Idle chatter — types in by itself every 20–30 s while the box is idle (Motion ON only). Fan-written lines.
- { id: idle-yawn, exp: sleepy, ja: "ふぁ〜……まだ眠くないし。あと1戦だけやるし……", en: "Yawn... I'm not sleepy. Just one more match..." , when: [night] }
- { id: idle-still-up, exp: smug, ja: "こんな時間まで起きてるの！？いひひ、仲間じゃん", en: "Still up at this hour!? Ihihi, you're one of us." , when: [night] }
- { id: idle-morning, exp: sleepy, ja: "お、おはよ……朝って、ほんとに来るんだね……", en: "G-good morning... so mornings really do happen..." , when: [morning] }
- { id: idle-lunch, exp: excited, ja: "お昼はお寿司！玉子！玉子は譲れないから！！", en: "Sushi for lunch! Tamago! I won't budge on tamago!!" , when: [day] }
- { id: idle-evening, exp: cheerful, ja: "夕方だ〜！そろそろ枠立てる時間じゃん！", en: "It's evening~! That's stream o'clock!" , when: [evening] }
- { id: idle-game, exp: excited, ja: "ねぇねぇ、あとでいっしょにゲームしよー！！", en: "Hey, hey! Let's play a game together later!!" , when: [any] }
- { id: idle-dust, exp: flustered, ja: "あっ、ほこり……スゥー……見なかったことにしよ", en: "Oh, dust... *sharp breath*... I didn't see that." , when: [any] }
- { id: idle-hum, exp: smile, ja: "ふんふ〜ん♪ ……はっ！聞いてた！？", en: "Hm-hmm~♪ ...Wait! Were you listening!?" , when: [any] }
- { id: idle-cat, exp: cheerful, ja: "NEKOがこっち見てる……かわいすぎない！？", en: "NEKO is staring at me... isn't that too cute!?" , when: [any] }
- { id: idle-click, exp: shy, ja: "あっ、えっと……この箱押したら、お話しできるよ", en: "Oh, um... press this box and we can talk." , when: [first-visit] }
- { id: idle-welcome-back, exp: smug, ja: "また来たの！？あてぃしのこと好きすぎじゃん！", en: "Back again!? You like me way too much!" , when: [returning] }
- { id: idle-water, exp: smile, ja: "ちょっとお水取ってくるね。……トイレじゃないよ！？", en: "Just grabbing some water. ...Not the bathroom!? Idols don't!" , when: [any] }
- { id: idle-anchor, exp: smile, ja: "いかり、ちゃんと下ろした？迷子になっちゃだめだよ", en: "Did you drop anchor? Don't drift off and get lost." , when: [any] }
- { id: idle-stretch, exp: cheerful, ja: "ん〜っ！ずっと座ってると肩バキバキだよね", en: "Mmmh! Sitting all day turns your shoulders to rock." , when: [any] }
- { id: idle-swim, exp: flustered, ja: "マリンメイドだけど泳げないよ。……なにか文句ある！？", en: "I'm a marine maid who can't swim. ...Got a problem with that!?" , when: [any] }
