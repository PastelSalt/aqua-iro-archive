# Ask — learning about her. Fan-written lines, not her actual words.
- id: favorite-game
  title: { ja: "なにして遊ぶ？", en: "What do you play?" }
  category: ask
  lines:
    - { exp: excited, ja: "ねぇねぇ！今日なにして遊ぶ！？", en: "Hey, hey! What are we playing today!?" }
  choices:
    - id: fav
      ja: "いちばん好きなゲームは？"
      en: "What's your favorite game?"
      reply:
        - { exp: flustered, ja: "えっ、ひとつ！？むりむりむり！！", en: "Just ONE!? No no no no!!" }
        - { exp: cheerful, ja: "やりこめるゲームはぜんぶ好き！ぜんぶ！", en: "Every game I can grind is my favorite! All of them!" }
    - id: kart
      ja: "マリカで勝負しよ！"
      en: "Mario Kart, you versus me!"
      reply:
        - { exp: smug, ja: "余裕余裕。あてぃし、ホロライブ杯の優勝者だよ？", en: "Easy, easy. You know I won the hololive cup, right?" }
      next: rematch
    - id: apex
      ja: "APEX、どうやって上手くなったの？"
      en: "How did you get so good at APEX?"
      reply:
        - { exp: cool, ja: "練習！負けて、キレて、また練習！それだけ！", en: "Practice! Lose, rage, practice again! That's all!" }
        - { exp: shy, ja: "ソロマス耐久、ずっと見ててくれてありがと……", en: "Thanks for watching the whole solo Master grind..." }
    - id: horror
      ja: "ホラーゲームは平気？"
      en: "Are you okay with horror games?"
      reply:
        - { exp: flustered, ja: "へ、平気だし！？ぜんぜんこわくないし！？ぴゃっ！？", en: "I-I'm totally fine!? Not scared at all!? Pyah!?" }
    - id: streams
      ja: "ゲーム配信を見たい！"
      en: "Show me your game streams!"
      reply:
        - { exp: cheerful, ja: "いいじゃん！配信アーカイブにぜんぶあるよ！", en: "Nice! They're all in the stream archive!" }
      goto: streaming
  nodes:
    rematch:
      lines:
        - { exp: pout, ja: "スゥーッ……いまのラグ！ノーカン！もう1回！！", en: "*Sharp breath*... That was lag! Doesn't count! AGAIN!!" }
      choices: []

- id: live-prep
  title: { ja: "ライブの前って？", en: "Before a live show" }
  category: ask
  lines:
    - { exp: flustered, ja: "ライブの前ってね、もう心臓バクバクなの……", en: "Before a live show my heart just goes thump-thump-thump..." }
  choices:
    - id: ritual
      ja: "本番前のおまじないはある？"
      en: "Do you have a good-luck ritual?"
      reply:
        - { exp: shy, ja: "えっと……クルーのみんなの顔、思い浮かべるの", en: "Um... I picture all the Crew's faces." }
    - id: practice
      ja: "ダンスの練習、大変だった？"
      en: "Was dance practice hard?"
      reply:
        - { exp: flustered, ja: "運動音痴だもん！最初ほんとに踊れなかった！", en: "I'm hopeless at sports! I really couldn't dance at first!" }
        - { exp: smug, ja: "でも今はね、先生にほめられるくらい上手いよ？", en: "But now my teacher actually praises me, you know?" }
    - id: fav-song
      ja: "ライブでいちばん好きな曲は？"
      en: "Your favorite song to perform?"
      reply:
        - { exp: excited, ja: "あくあ色ぱれっと！みんなのコール、聞こえてたよ！", en: "Aqua Iro Palette! I could hear all of your calls!" }
    - id: lights
      ja: "ペンライト、ちゃんと見えてた？"
      en: "Could you see our glow sticks?"
      reply:
        - { exp: excited, ja: "見えてた見えてた！ピンクと水色の海！やばかった！", en: "I saw them! A sea of pink and light blue! It was crazy!" }
    - id: songs
      ja: "曲をもっと聴きたいな"
      en: "I want to hear more of your songs"
      reply:
        - { exp: cheerful, ja: "ディスコグラフィにぜんぶまとめてあるよ！", en: "They're all gathered in the discography!" }
      goto: discography

- id: maid-duties
  title: { ja: "メイドのお仕事", en: "Maid duties" }
  category: ask
  lines:
    - { exp: smug, ja: "アイドルゲーマーメイド、今日もお仕事しまーす！", en: "Your idol gamer maid, clocking in for work!" }
  choices:
    - id: cooking
      ja: "得意な料理は？"
      en: "What's your best dish?"
      reply:
        - { exp: smug, ja: "オムライス！ケチャップで「ご主人♡」って書けるよ！", en: "Omurice! I can even write \"Master ♡\" in ketchup!" }
        - { exp: flustered, ja: "……中の玉ねぎが生なのは、仕様です", en: "...The raw onion inside is a feature." }
    - id: cleaning
      ja: "お掃除は得意？"
      en: "Are you good at cleaning?"
      reply:
        - { exp: flustered, ja: "モ、モップは持ってるし！使うかは別だけど！", en: "I-I own a mop! Using it is another story!" }
    - id: tea
      ja: "紅茶をいれてほしいな"
      en: "Could you make me some tea?"
      reply:
        - { exp: cheerful, ja: "はーい！……あっ、アールグレイはだめ！あてぃしが飲めない！", en: "Okay! ...Oh, not Earl Grey! I can't drink that one!" }
    - id: day-off
      ja: "メイドのお休みの日は？"
      en: "What does a maid do on her day off?"
      reply:
        - { exp: sleepy, ja: "ゲームして、寝て、起きてゲーム！ずっとお休みかも", en: "Game, sleep, wake up, game! Maybe every day's a day off." }
    - id: outfits
      ja: "メイド服、ほかにもあるの？"
      en: "Do you have other maid outfits?"
      reply:
        - { exp: excited, ja: "いっぱいある！アートのページ見て見て！！", en: "Tons! Look, look, on the Arts page!!" }
      goto: arts

- id: the-cat
  title: { ja: "ねこのはなし", en: "About the cat" }
  category: ask
  lines:
    - { exp: smile, ja: "ねこってさ、ずっと見てられるよね〜", en: "You could watch cats forever, right~?" }
  choices:
    - id: neko
      ja: "NEKOって何者？"
      en: "Who is NEKO, anyway?"
      reply:
        - { exp: smug, ja: "あてぃしが生んだマスコット！USAGIもいるよ！", en: "A mascot I created! There's USAGI too!" }
    - id: dog-or-cat
      ja: "犬派？猫派？"
      en: "Dog person or cat person?"
      reply:
        - { exp: smug, ja: "それ聞く？ねこ一択じゃん！", en: "You have to ask? Cats, obviously!" }
    - id: cat-sounds
      ja: "ねこのまねして！"
      en: "Do a cat impression!"
      reply:
        - { exp: shy, ja: "にゃ、にゃー……っ、もう！はずかしいじゃん！！", en: "Nya... nyaa... ugh! That's embarrassing!!" }
    - id: sleep
      ja: "ねこみたいに寝てない？"
      en: "Don't you sleep like a cat?"
      reply:
        - { exp: sleepy, ja: "まるくなるとね、落ち着くの……すぴー……", en: "Curling up is so comfy... zzz..." }

- id: favorite-song-own
  title: { ja: "じぶんの歌", en: "Her own songs" }
  category: ask
  lines:
    - { exp: cheerful, ja: "歌うの、むかしから大好きなんだ！", en: "I've always loved singing!" }
  choices:
    - id: first
      ja: "初めての歌ってみたは？"
      en: "What was your first cover?"
      reply:
        - { exp: shy, ja: "インドア系ならトラックメイカー……なつかし〜！", en: "Indoor Kei nara Trackmaker... that's so nostalgic~!" }
    - id: palette
      ja: "あくあ色ぱれっとってどんな曲？"
      en: "What's Aqua Iro Palette about?"
      reply:
        - { exp: excited, ja: "あてぃしの色をみんなに届けるの！めっちゃバズった！", en: "Sending my colors to all of you! And it went super viral!" }
    - id: karaoke
      ja: "歌枠でよく歌う曲は？"
      en: "What do you sing a lot in karaoke streams?"
      reply:
        - { exp: cheerful, ja: "アニソンとボカロと、声優さんの曲！いのりんとか！", en: "Anime songs, Vocaloid, and voice-actor songs! Like Inorin's!" }
    - id: hard
      ja: "いちばん難しかった曲は？"
      en: "Which song was hardest?"
      reply:
        - { exp: flustered, ja: "早口の曲！舌がもつれて、あてぃしが「あてぃし」になる！", en: "The fast ones! My tongue trips and \"atashi\" turns into \"atishi\"!" }
    - id: listen
      ja: "全部の曲を聴きたい"
      en: "I want to hear all of them"
      reply:
        - { exp: smile, ja: "オリ曲も歌ってみたも、ディスコにあるよ！", en: "Originals and covers are all in the discography!" }
      goto: discography

- id: crew-name
  title: { ja: "あくあクルー", en: "The Aqua Crew" }
  category: ask
  lines:
    - { exp: cheerful, ja: "ねぇ、あくあクルーってどんな人たちだと思う？", en: "Hey, what kind of people do you think the Aqua Crew are?" }
  choices:
    - id: kind
      ja: "やさしい人ばっかり！"
      en: "Kind people, every one of them!"
      reply:
        - { exp: smug, ja: "でしょ！？あてぃしの自慢のクルーだもん！", en: "Right!? They're my pride and joy!" }
    - id: loud
      ja: "コメント欄がにぎやか"
      en: "A very noisy comment section"
      reply:
        - { exp: pout, ja: "「あくあ狂う」って書くのやめて！？狂ってないし！", en: "Stop typing \"Aqua's lost it\"!? I haven't lost anything!" }
    - id: anchor
      ja: "⚓マークの意味は？"
      en: "What does the ⚓ mean?"
      reply:
        - { exp: smile, ja: "いかりはね、みんなが帰ってくる港のしるし！", en: "The anchor marks the harbor everyone comes home to!" }
    - id: onion
      ja: "なんで玉ねぎなの？"
      en: "Why onions, though?"
      reply:
        - { exp: pout, ja: "似てないし！……スゥー……ちょっと似てるけど！！", en: "I don't look like one! ...*sharp breath*... okay, a little!!" }
    - id: board
      ja: "クルーの寄せ書きを見たい"
      en: "I want to see the crew's notes"
      reply:
        - { exp: shy, ja: "寄せ書きボードにいっぱい貼ってあるよ……うれしい", en: "There are so many on the message board... it makes me happy." }
      goto: messages
