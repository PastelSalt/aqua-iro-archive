name: Weekly DB backup

on:
  schedule:
    - cron: '0 19 * * 6' # Sunday 03:00 Asia/Manila
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Install pg_dump 17 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
      - name: Dump and encrypt
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          stamp=$(date -u +%Y%m%d)
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --format=custom "$DATABASE_URL_UNPOOLED" -f "aqua-$stamp.dump"
          age -R ops/backup-recipient.txt -o "aqua-$stamp.dump.age" "aqua-$stamp.dump"
          rm "aqua-$stamp.dump"
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: '*.dump.age'
          retention-days: 90
